[package]
name = "omp-better-desktop"
version = "0.2.0"
edition = "2024"
default-run = "omp-better-desktop"

[lib]
name = "omp_better_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
omp-rpc = { path = "../vendor/omp-rpc" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
