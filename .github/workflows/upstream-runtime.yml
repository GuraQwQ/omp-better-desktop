name: 更新内置 OMP

on:
  schedule:
    - cron: "19 */12 * * *"
  workflow_dispatch:
    inputs:
      pull_request:
        description: 重试现有机器人 PR；留空时检查上游新版本
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: upstream-runtime
  cancel-in-progress: false

jobs:
  build:
    if: inputs.pull_request == ''
    runs-on: windows-latest
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
      version: ${{ steps.upstream.outputs.version }}
    env:
      OMP_DESKTOP_CACHE: ${{ github.workspace }}/.cache
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/desktop-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - id: upstream
        name: 检查上游发行版本
        run: bun run update:upstream
      - if: steps.upstream.outputs.changed == 'true'
        name: 构建并验证候选运行时
        env:
          OMP_UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          OMP_UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
          OMP_UPSTREAM_ROOT: ${{ steps.upstream.outputs.upstreamRoot }}
          OMP_BUILD_ROOT: ${{ steps.upstream.outputs.upstreamRoot }}
        run: bun run build:runtime
      - if: steps.upstream.outputs.changed == 'true'
        name: 整理更新补丁
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/update | Out-Null
          git diff --binary --output=artifacts/update/runtime.patch -- upstream.lock.json docs/feature-map.md src/generated vendor/omp-rpc/src/client.rs vendor/omp-rpc/src/wire.rs
      - if: steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: omp-update-source
          path: artifacts/update/runtime.patch
          if-no-files-found: error

  propose:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      number: ${{ steps.pr.outputs.pull-request-number }}
      branch: ${{ steps.pr.outputs.pull-request-branch }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: omp-update-source
          path: ${{ runner.temp }}/omp-update
      - name: 应用生成文件补丁
        env:
          UPDATE_PATCH: ${{ runner.temp }}/omp-update/runtime.patch
        run: git apply --include=upstream.lock.json --include=docs/feature-map.md --include='src/generated/*' --include=vendor/omp-rpc/src/client.rs --include=vendor/omp-rpc/src/wire.rs "$UPDATE_PATCH"
      - id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/omp-${{ needs.build.outputs.version }}
          delete-branch: true
          add-paths: |
            upstream.lock.json
            docs/feature-map.md
            src/generated
            vendor/omp-rpc/src/client.rs
            vendor/omp-rpc/src/wire.rs
          title: "构建：内置 OMP ${{ needs.build.outputs.version }}"
          commit-message: "构建：更新内置 OMP ${{ needs.build.outputs.version }}"
          body: |
            更新锁定的 OMP 版本及配套协议和功能目录。

            独立只读任务已构建 OMP 运行时并执行无模型调用的协议烟测。

            同一主次版本的补丁升级在来源、锁文件和生成文件范围符合要求时，自动批准必要的 PR 检查；检查与安装器构建通过后 squash 合并并发布预览包。其他升级保留人工确认。

  check-pr:
    needs: propose
    if: always() && (inputs.pull_request != '' || (needs.propose.outputs.number != '' && needs.propose.outputs.operation != 'closed'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pull_request || needs.propose.outputs.number }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 启用补丁升级条件自动合并
        run: node scripts/upstream-pr.mjs enable "$PR_NUMBER"
